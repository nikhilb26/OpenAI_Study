name: Python Auto-Runner

on: [push]

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Steps Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Python Code
        run: python -c "print(' Hello Nikhil! Python is running perfectly on GitHub Actions!')"