name: Code Checker Linter

on: [push]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8 Linter
        run: pip install flake8
      
      - name: Run Linter and Save Report
        run: |
          echo "Checking Python Code for syntax error..."
          flake8 . > flake8_report.txt || echo "Code check complete!"

      - name: Upload Report as Artifact
        uses: action/upload-artifact@v4
        with:
          name: Linter-Report
          path: flake8_report.txt

      