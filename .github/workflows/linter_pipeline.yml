name: Code Checker Linter

on: [push]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8 Linter
        run: pip install flake8

      - name: Run Linter
        run: |
          echo " Checking Python code for sysntax errors..."
          flake8. || echo " Code check complete!"
          