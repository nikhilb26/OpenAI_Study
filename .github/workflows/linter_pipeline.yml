name: Code Checker Linter

on: [push]

jobs:
    check-code:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3
            
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.10'

            - name: Run Linter
              run: |
                echo " Checking Python code for syntax errors..."
                flake8. || echo " Code check complete!"